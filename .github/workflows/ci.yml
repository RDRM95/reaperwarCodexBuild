name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE: /reaperwar/
      - name: Install Playwright browser
        # The install fetches system packages with apt. A runner that cannot resolve the package mirror for a
        # moment failed the whole job before any test ran, so the step is tried up to three times.
        run: |
          for attempt in 1 2 3; do
            if npx playwright install --with-deps chromium; then exit 0; fi
            echo "Browser install failed (attempt $attempt of 3)"
            sleep 30
          done
          exit 1
      - name: End-to-end tests (built app, software WebGL)
        run: npm run test:e2e -- --reporter=list,github,html
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
