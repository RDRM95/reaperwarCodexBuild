name: Reference models and large-fleet regression
on:
  pull_request:
    branches:
      - codex/apex-combat-overhaul
permissions:
  contents: read
jobs:
  reference-and-fleet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Test P0 data and Reaper mechanical rig
        run: npx vitest run tests/ship-reference.test.ts
      - name: Install Chromium
        # The install also fetches system packages (fonts, mostly) with apt. When the runner cannot reach the
        # package mirror that failed the whole job before any test ran, for as long as the mirror was down. The
        # runner image already carries the libraries Chromium needs, so in that case install the browser alone.
        run: |
          if npx playwright install --with-deps chromium; then exit 0; fi
          echo "::warning::System packages could not be fetched; installing the browser without them"
          npx playwright install chromium
      - name: Test large-fleet HUD responsiveness
        run: npx playwright test e2e/fleet-overlay.spec.ts e2e/au-expansion.spec.ts --workers=1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reference-and-fleet-failures
          path: test-results/
          retention-days: 7
